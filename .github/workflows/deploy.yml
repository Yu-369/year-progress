
name: Year Progress App Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Setup Environment
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Build Web Application
      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          # IMPORTANT: Add GEMINI_API_KEY to your GitHub Repo -> Settings -> Secrets and variables -> Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 3. Generate & Build Android APK
      - name: Initialize Android Project
        run: npx cap sync

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 4. Upload APK Artifact (Binary for download)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: year-progress-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 5. Upload Web Artifact (For GitHub Pages)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 6. Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
