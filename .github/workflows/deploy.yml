
name: Year Progress App Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Setup Environment
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Build Web Application
      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      # 3. Generate & Build Android APK
      - name: Initialize Android Project
        run: npx cap sync

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 4. Upload APK Artifact (This is the file you want!)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: year-progress-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 6. Create GitHub Release (The "Publish" part)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
